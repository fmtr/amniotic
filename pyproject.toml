[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.corio.metadata]
version = "1.9.1-alpha002"
port = 7
base = "python"
description = "A multi-output ambient sound mixer for Home Assistant"
org_github = "fmtr"
org_friendly = "Frontmatter AI"
is_client = false
scripts = []
services = []
keywords = ["ambient sound", "audio", "white noise", "masking", "sleep"]
is_pypi = true
is_dockerhub = true

[tool.corio.metadata.setup]

[tool.setuptools]
script-files = ["scripts/vlc-tn.service"]

[tool.setuptools.packages.find]
where = ["."]
include = ["amniotic*"]
namespaces = false

[tool.setuptools.package-data]
amniotic = ["pyproject.package.toml"]

[tool.uv.sources.corio]
path = "../corio"
editable = true

[tool.uv.sources.haco]
path = "../haco"
editable = true

[project]
name = "amniotic"
version = "1.9.1-alpha002"
description = "A multi-output ambient sound mixer for Home Assistant"
readme = "README.md"
license = "Apache-2.0"
keywords = ["ambient sound", "audio", "white noise", "masking", "sleep"]
requires-python = ">=3.13"
dependencies = ["corio[api,av,caching,debug,ha.api,http,logging,mqtt,path.app,sets,tabular,version.dev,yaml,youtube]==2.2.2-alpha002", "haco==0.3.4-alpha008", "psutil"]

[[project.authors]]
name = "Frontmatter AI"
email = "innovative.fowler@mask.pro.fmtr.dev"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
amniotic = "amniotic.entrypoint:main"

[project.urls]
Homepage = "https://github.com/fmtr/amniotic"
